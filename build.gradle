plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.sist'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-webservices'
	/* thymeleaf */
	implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect:4.0.1'
	/* mybatis */
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.1'
	/* jpa - querydsl */
	implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
	/* spring security */
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	/* thymeleaf 환경에서 springsecurity 사용할 때 작성해줘야함 */
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
	/* json 변환 */
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	/* kafka */
	implementation 'org.springframework.boot:spring-boot-starter-kafka'
	/* jsoup */
	implementation 'org.jsoup:jsoup:1.23.1'
	/* 일반 라이브러리 가져다 쓸 때 등록하는 방법 */
	/* 데이터 분석할 때 사용하는 library */
	implementation files('libs/org.snu.ids.ha.jar')
    annotationProcessor "com.querydsl:querydsl-apt:5.0.0:jakarta"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.oracle.database.jdbc:ojdbc11'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-jdbc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webservices-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}
