<!DOCTYPE html>
<!-- 
XML 네임스페이스(xmlns) : HTML/XML 문서 내에서 사용되는 속성이나 태그 이름이 다른 라이브러리와 충돌하지 않도록 구별해 주는 '고유한 이름표' 역할
xmlns에 sec는 고유 식별용 문자열 꼭 sec로 안적어도 됨, 적힌 url은 실제로 접속하는 url이 아니고 타임리프엔진이 url을 읽고 라이브러리에 있는 연결 대상 라이브러리를 판단하여 매핑하는 key 역할
 -->
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"> <!-- sec 접두사를 쓰겠다고 명시 -->
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<nav class="navbar navbar-inverse">
		<div class="container-fluid">
			<div class="navbar-header">
				<a class="navbar-brand" href="/">Pinia</a>
			</div>
			<ul class="nav navbar-nav">
				<li class="active">
					<a href="/">Home</a>
				</li>
				<li class="dropdown">
					<a class="dropdown-toggle" data-toggle="dropdown" href="#">
						맛집
						<span class="caret"></span>
					</a>
					<ul class="dropdown-menu">
						<li>
							<a href="#">맛집검색</a>
						</li>
						<li>
							<a href="#">맛집추천</a>
						</li>
					</ul>
				</li>
				<li class="dropdown">
					<a class="dropdown-toggle" data-toggle="dropdown" href="#">
						레시피
						<span class="caret"></span>
					</a>
					<ul class="dropdown-menu">
						<li>
							<a href="#">레시피</a>
						</li>
						<li>
							<a href="#">검색</a>
						</li>
						<li>
							<a href="#">쉐프</a>
						</li>
					</ul>
				</li>
				<li>
					<a href="#">실시간 채팅</a>
				</li>
				<li>
					<a href="#">빠른 예약</a>
				</li>
			</ul>
			<ul class="nav navbar-nav navbar-right">
				<li sec:authorize="!isAuthenticated()">
					<a href="#">
						<span class="glyphicon glyphicon-user"></span>
						회원가입
					</a>
				</li>
				<li sec:authorize="!isAuthenticated()">
					<a href="/member/login">
						<span class="glyphicon glyphicon-log-in"></span>
						로그인
					</a>
				</li>
				<li sec:authorize="isAuthenticated()">
				<li sec:authorize="hasRole('ADMIN')">
					<a href="#">
						<span sec:authentication="name"></span>
						(관리자) 로그인되었습니다
					</a>
				</li>
				<li sec:authorize="hasRole('USER')">
					<a href="#">
						<span sec:authentication="name"></span>
						(일반사용자) 로그인되었습니다
					</a>
				</li>
				<li sec:authorize="isAuthenticated()">
					<a href="/member/logout">
						<span class="glyphicon glyphicon-log-in"></span>
						로그아웃
					</a>
				</li>
			</ul>
		</div>
	</nav>
</body>
</html>
